<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>两人聊天 - 自定义头像</title>
<style>
body { margin:0; font-family:"微软雅黑",Arial,sans-serif; background:#f0f2f5; }
#setup { padding:20px; background:#fff; display:flex; flex-direction:column; align-items:center; height:100vh; justify-content:center; }
#setup input { padding:8px; font-size:16px; margin-bottom:10px; width:200px; }
#avatar-options img { width:50px; height:50px; border-radius:50%; margin:5px; cursor:pointer; border:2px solid transparent; }
#avatar-options img.selected { border-color:#1e90ff; }
#startBtn { padding:8px 16px; font-size:16px; cursor:pointer; }

.chat-container { display:none; flex-direction:column; height:100vh; }
#online-status { padding:10px 12px; background:#0078ff; color:white; font-size:14px; text-align:center; display:flex; align-items:center; justify-content:space-between; gap:12px; }
#statusMeta { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
#roomBadge { padding:4px 8px; border-radius:999px; background:rgba(255,255,255,0.18); font-size:12px; }
#exitBtn { padding:7px 12px; background:rgba(255,255,255,0.18); color:white; border:none; border-radius:999px; cursor:pointer; font-size:13px; }
#exitBtn:hover { background:rgba(255,255,255,0.28); }
#messages { flex:1; padding:20px; overflow-y:auto; }
.message { display:flex; margin-bottom:15px; align-items:flex-start; }
.message.other { flex-direction:row; }
.message.self { flex-direction:row-reverse; }
.message img { width:40px; height:40px; border-radius:50%; }
.message-info { display:flex; font-size:12px; color:#555; margin-bottom:2px; }
.message-info span { margin-right:5px; }
.bubble { max-width:90%; padding:10px 15px; border-radius:15px; word-wrap:break-word; position:relative; }
.bubble.self { background:#1e90ff; color:white; border-bottom-right-radius:0; }
.bubble.other { background:#fff; color:black; border-bottom-left-radius:0; }
.input-box { display:flex; padding:10px; background:#f0f0f0; border-top:1px solid #ccc; }
#messageInput { flex:1; padding:10px; font-size:16px; border-radius:5px; border:1px solid #ccc; outline:none; }
#sendBtn { padding:10px 20px; margin-left:10px; background:#1e90ff; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px; }
#sendBtn:hover { background:#187bcd; }
</style>
</head>
<body>

<!-- 设置昵称和选择头像 -->
<div id="setup">
    <h2>输入你的昵称</h2>
    <input id="usernameInput" placeholder="昵称" />
    <h2>房间密码</h2>
    <input id="roomCodeInput" placeholder="留空自动创建随机房间" />
    <h2>选择头像</h2>
    <div id="avatar-options">
        <img src="https://i.pravatar.cc/50?img=1">
        <img src="https://i.pravatar.cc/50?img=2">
        <img src="https://i.pravatar.cc/50?img=3">
        <img src="https://i.pravatar.cc/50?img=4">
    </div>
    <button id="startBtn">开始聊天</button>
</div>

<!-- 聊天界面 -->
<div class="chat-container" id="chatContainer">
    <div id="online-status">
        <span id="statusText">等待另一位用户上线...</span>
        <div id="statusMeta">
            <span id="roomBadge">房间：-</span>
            <button id="exitBtn" type="button">主动退出</button>
        </div>
    </div>
    <div id="messages"></div>
    <div class="input-box">
        <input id="messageInput" placeholder="输入消息..." />
        <button id="sendBtn">发送</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const STORAGE_KEY = "jzx-chat-profile";
let myUsername = "";
let myAvatar = "";
let mySessionId = "";
let myRoomCode = "";
let roomUsers = [];
let hasJoinedRoom = false;
const socket = io();

const setupDiv = document.getElementById("setup");
const chatContainer = document.getElementById("chatContainer");
const usernameInput = document.getElementById("usernameInput");
const roomCodeInput = document.getElementById("roomCodeInput");
const avatarOptions = document.getElementById("avatar-options").getElementsByTagName("img");
let selectedAvatar = avatarOptions[0].src;
const startBtn = document.getElementById("startBtn");
const statusText = document.getElementById("statusText");
const roomBadge = document.getElementById("roomBadge");
const exitBtn = document.getElementById("exitBtn");

function createSessionId(){
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
    }
    return `session-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function loadProfile(){
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch (error) {
        return null;
    }
}

function saveProfile(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        user: myUsername,
        avatar: myAvatar,
        sessionId: mySessionId,
        roomCode: myRoomCode,
    }));
}

function clearProfile(){
    localStorage.removeItem(STORAGE_KEY);
}

function setAvatarSelection(src){
    selectedAvatar = src;
    for(let i of avatarOptions) {
        i.classList.toggle("selected", i.src === selectedAvatar);
    }
}

function showChat(){
    setupDiv.style.display = "none";
    chatContainer.style.display = "flex";
}

function showSetup(){
    setupDiv.style.display = "flex";
    chatContainer.style.display = "none";
}

function updateRoomBadge(){
    roomBadge.textContent = myRoomCode ? `房间：${myRoomCode}` : "房间：-";
}

function updateStatus(users){
    if (!mySessionId) {
        statusText.textContent = "等待另一位用户上线...";
        return;
    }

    const other = users.find((u) => u.sessionId !== mySessionId);
    if (!other) {
        statusText.textContent = "等待另一位用户上线...";
        return;
    }

    statusText.textContent = other.online ? `${other.user} 已上线` : `${other.user} 暂时离线，30 分钟内不回来将会自动退出`;
}

function joinRoom(){
    if (!myUsername || !myAvatar || !mySessionId || hasJoinedRoom) {
        return;
    }

    hasJoinedRoom = true;
    const payload = { user: myUsername, avatar: myAvatar, sessionId: mySessionId };
    if (myRoomCode) {
        socket.emit("join-room", { ...payload, roomCode: myRoomCode });
    } else {
        socket.emit("create-room", payload);
    }
}

function resetCurrentUser({ keepSocket = true } = {}){
    hasJoinedRoom = false;
    myUsername = "";
    myAvatar = "";
    mySessionId = "";
    myRoomCode = "";
    roomUsers = [];
    messages.innerHTML = "";
    usernameInput.value = "";
    roomCodeInput.value = "";
    setAvatarSelection(avatarOptions[0].src);
    clearProfile();
    statusText.textContent = "等待另一位用户上线...";
    updateRoomBadge();
    showSetup();

    if (keepSocket && socket.connected) {
        socket.emit("leave-room", {});
    }
}

for(let img of avatarOptions){
    img.addEventListener("click", ()=>{
        setAvatarSelection(img.src);
    });
}

const savedProfile = loadProfile();
if (savedProfile && savedProfile.user && savedProfile.avatar && savedProfile.sessionId) {
    myUsername = savedProfile.user;
    myAvatar = savedProfile.avatar;
    mySessionId = savedProfile.sessionId;
    myRoomCode = savedProfile.roomCode || "";
    usernameInput.value = myUsername;
    roomCodeInput.value = myRoomCode;
    setAvatarSelection(myAvatar);
    updateRoomBadge();
    showChat();
}

startBtn.addEventListener("click", ()=>{
    const name = usernameInput.value.trim();
    if(!name){ alert("请输入昵称"); return; }
    myUsername = name;
    myAvatar = selectedAvatar;
    myRoomCode = roomCodeInput.value.trim().toUpperCase();
    mySessionId = mySessionId || createSessionId();
    hasJoinedRoom = false;
    joinRoom();
});

exitBtn.addEventListener("click", ()=>{
    resetCurrentUser();
});

const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const btn = document.getElementById("sendBtn");

function getTimeStr(){ 
    const d = new Date();
    return d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0'); 
}

function addMessage(msgObj){
    const div=document.createElement("div");
    div.classList.add("message");
    div.classList.add(msgObj.user===myUsername?"self":"other");

    const avatar=document.createElement("img");
    avatar.src=msgObj.user===myUsername?myAvatar:msgObj.avatar;

    const info=document.createElement("div");
    info.classList.add("message-info");
    const nameSpan=document.createElement("span");
    nameSpan.textContent=msgObj.user;
    const timeSpan=document.createElement("span");
    timeSpan.textContent=msgObj.time;
    info.appendChild(nameSpan);
    info.appendChild(timeSpan);

    const bubble=document.createElement("div");
    bubble.classList.add("bubble");
    bubble.classList.add(msgObj.user===myUsername?"self":"other");
    bubble.textContent=msgObj.message;

    const wrapper=document.createElement("div");
    wrapper.appendChild(info);
    wrapper.appendChild(bubble);

    div.appendChild(avatar);
    div.appendChild(wrapper);

    messages.appendChild(div);
    messages.scrollTop=messages.scrollHeight;
}

btn.addEventListener("click", ()=>{
    const msg=input.value.trim();
    if(!msg) return;
    const msgObj={id:Date.now()+Math.random(), user:myUsername, message:msg, avatar:myAvatar, time:getTimeStr(), sessionId: mySessionId};
    socket.emit("chat message", msgObj);
    input.value="";
    addMessage(msgObj);
});

input.addEventListener("keydown",(e)=>{ if(e.key==="Enter") btn.click(); });

socket.on("connect", ()=> {
    if (myUsername && myAvatar && mySessionId) {
        hasJoinedRoom = false;
        joinRoom();
    }
});

if (socket.connected && myUsername && myAvatar && mySessionId) {
    joinRoom();
}

socket.on("disconnect",()=>{
    if (myUsername) {
        statusText.textContent = myRoomCode ? `房间 ${myRoomCode} 连接已断开，30 分钟内可自动恢复` : "连接已断开，30 分钟内可自动恢复";
    }
    hasJoinedRoom = false;
});

socket.on("chat message",(msgObj)=>{ if(msgObj.sessionId && msgObj.sessionId===mySessionId) return; if(msgObj.user===myUsername && !msgObj.sessionId) return; addMessage(msgObj); });

socket.on("room-created", ({ roomCode }) => {
    myRoomCode = roomCode;
    roomCodeInput.value = roomCode;
    updateRoomBadge();
    saveProfile();
    showChat();
    joinRoom();
});

socket.on("room-state", ({ roomCode, users }) => {
    if (!roomCode) return;
    if (!myRoomCode) {
        myRoomCode = roomCode;
        roomCodeInput.value = roomCode;
        updateRoomBadge();
    }
    if (myRoomCode !== roomCode) return;

    roomUsers = users;
    updateStatus(users);
    saveProfile();
    showChat();
    hasJoinedRoom = false;
});

socket.on("room-error",(msg)=>{
    alert(msg);
    hasJoinedRoom = false;
    showSetup();
});
</script>
</body>
</html>
